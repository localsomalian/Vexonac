/* ─── NUI helper ──────────────────────────────────────────────────────────── */
function nuiCb(action, data) {
  data = data || {};
  const resource = typeof GetParentResourceName !== 'undefined' ? GetParentResourceName() : 'vexonac_hud';
  fetch('https://' + resource + '/' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  }).catch(function(){});
}

/* ─── Helpers ─────────────────────────────────────────────────────────────── */
function threatColor(s) { return s <= 20 ? 'text-green-400' : s <= 40 ? 'text-yellow-400' : s <= 70 ? 'text-orange-400' : 'text-red-400'; }
function pingColor(p)   { return p <= 50 ? 'text-green-400' : p <= 100 ? 'text-yellow-400' : 'text-red-400'; }
function hpColor(h)     { const p = (h/200)*100; return p > 60 ? 'bg-green-500' : p > 30 ? 'bg-yellow-500' : 'bg-red-500'; }
function fmtMins(m)     { const hr = Math.floor(m/60), n = m%60; return hr ? (hr + 'h ' + n + 'm') : (n + 'm'); }
function timeAgo(d) {
  const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  return Math.floor(s/3600) + 'h ago';
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

const STATUS_CFG = {
  ON_FOOT:    { icon: I.footpr, bg: 'bg-green-900/30',  text: 'text-green-400',  label: 'On Foot' },
  IN_VEHICLE: { icon: I.car,    bg: 'bg-amber-900/30',  text: 'text-amber-400',  label: 'In Vehicle' },
  SWIMMING:   { icon: I.waves,  bg: 'bg-violet-900/30', text: 'text-violet-400', label: 'Swimming' },

};

/* ─── Leaflet ─────────────────────────────────────────────────────────────── */
const SCALE = 0.0206;
const GTA = { minX:-117.3/SCALE, minY:(172.8-256)/SCALE, maxX:(256-117.3)/SCALE, maxY:172.8/SCALE };
const WORLD_W = GTA.maxX - GTA.minX, WORLD_H = GTA.maxY - GTA.minY;
const TILE = 256, MAX_Z = 5, WPX = TILE * Math.pow(2, MAX_Z);
function gtaLL(x, y) { return [WPX*(1-(y-GTA.minY)/WORLD_H), WPX*((x-GTA.minX)/WORLD_W)]; }
function makeMap(el) {
  const CRS = L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(1,0,1,0) });
  const m = L.map(el, { crs:CRS, minZoom:0, maxZoom:MAX_Z, zoom:2, center:gtaLL(0,0), zoomControl:false, attributionControl:false });
  L.tileLayer('/map-tiles/satelite/{z}/{x}/{y}.png', { tileSize:TILE, maxZoom:MAX_Z, bounds:[[0,0],[WPX,WPX]] }).addTo(m);
  L.control.zoom({ position:'bottomright' }).addTo(m);
  return m;
}
function useLiveMarkers(players, mapRef) {
  useEffect(function() {
    const m = mapRef.current;
    if (!m) return;
    m.eachLayer(function(l) { if (l instanceof L.Marker) l.remove(); });
    players.forEach(function(p) {
      if (!p.coords) return;
      const c = p.threatScore > 70 ? '#f87171' : p.threatScore > 40 ? '#fb923c' : p.threatScore > 20 ? '#fbbf24' : '#4ade80';
      const icon = L.divIcon({
        html: '<div style="width:18px;height:18px;border-radius:50%;background:' + c + ';border:2px solid rgba(0,0,0,.5);box-shadow:0 0 5px ' + c + '99;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#000">' + (p.name||'?')[0] + '</div>',
        className:'', iconSize:[18,18], iconAnchor:[9,9]
      });
      const mk = L.marker(gtaLL(p.coords.x, p.coords.y), { icon }).addTo(m);
      mk.bindTooltip('<b style="color:' + c + '">' + p.name + '</b><br>ID:' + p.id + ' · Threat:' + p.threatScore, { direction:'top' });
    });
  }, [players]);
}

/* ─── LiveBadge ───────────────────────────────────────────────────────────── */

              ${item.id === 'chat' && chatUnread > 0 && html`<span class="ml-auto text-[10px] font-bold min-w-[18px] h-[18px] rounded-full flex items-center justify-center px-1 bg-red-500/10 text-red-400">!</span>`}

            ${(adminName||'A')[0].toUpperCase()}

          <div class="min-w-0">

/* ─── TopBar ──────────────────────────────────────────────────────────────── */
const TAB_TITLES = { dashboard:'Server Dashboard', players:'Players', chat:'Admin Chat', detections:'Detections', bans:'Bans', logs:'Logs', map:'Live Map', settings:'Settings' };

/* ─── PlayerCard ──────────────────────────────────────────────────────────── */
function PlayerCard({ player, onAction }) {
  const sc = STATUS_CFG[player.status] || STATUS_CFG.ON_FOOT;
  const isNew = (player.playTime || 0) < 60;
  const justJoined = player.timeOnline < 30;
  return html`
    <div onClick=${() => onAction('details', player)}
      class="rounded-xl border border-border/50 bg-card overflow-hidden hover:shadow-sm transition-all cursor-pointer">
      <div class="p-4">
        <div class="flex justify-between items-start mb-4">
          <div class="flex items-center gap-3">
            <div class=${'h-10 w-10 rounded-full flex items-center justify-center shrink-0 ' + sc.bg + ' ' + sc.text}>
              <${Ico} d=${sc.icon} className="h-5 w-5" />
            </div>
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs text-muted-foreground">#${player.id}</span>
                <span class="font-semibold text-sm truncate max-w-[110px]">${player.name}</span>
                ${player.admin && html`<span class="text-[10px] font-medium px-1.5 py-0.5 rounded border border-border/50 text-muted-foreground leading-none">Admin</span>`}
              </div>
              <div class="flex items-center gap-1 text-xs text-muted-foreground mt-0.5">
                <${Ico} d=${I.clock} className="h-3 w-3" />
                <span>${fmtMins(Math.floor(player.timeOnline/60))}</span>
              </div>
            </div>
          </div>
          <div class="flex flex-col items-end gap-1.5 shrink-0">
            <span class=${'text-xs font-mono flex items-center gap-1 ' + pingColor(player.ping)}>
              <${Ico} d=${player.ping <= 100 ? I.wifi : I.wifiOff} className="h-3.5 w-3.5" />
              ${player.ping}ms
            </span>
            ${player.threatScore !== undefined && html`<span class=${'text-xs font-mono ' + threatColor(player.threatScore)}>${player.threatScore}</span>`}
          </div>
        </div>
        ${player.health !== undefined && html`
          <div class="mb-4 space-y-1">
            <div class="flex justify-between text-xs text-muted-foreground">
              <span>Health</span><span>${Math.round((player.health/200)*100)}%</span>

            <div class="w-full bg-border/50 rounded-full h-1.5">
              <div class=${'h-1.5 rounded-full ' + hpColor(player.health)} style=${{ width: Math.min((player.health/200)*100,100) + '%' }} />
            </div>
          </div>
        `}
        <div class="flex justify-between items-center text-xs text-muted-foreground">
          <div class="flex items-center gap-1"><${Ico} d=${I.play} className="h-3 w-3" />${fmtMins(Math.floor((player.playTime||0)/60))}</div>
          <div class="flex gap-1">
            ${isNew && html`<span class="text-[10px] px-1.5 py-0.5 rounded bg-primary/10 text-primary border border-primary/20">New</span>`}
            ${justJoined && html`<span class="text-[10px] px-1.5 py-0.5 rounded bg-secondary text-muted-foreground">Just joined</span>`}
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ─── Player detail modal ─────────────────────────────────────────────────── */
function PlayerDetailModal({ player, onClose, onAction }) {
  const [view, setView] = useState('details');
  const [reason, setReason] = useState('');
  const sc = STATUS_CFG[player.status] || STATUS_CFG.ON_FOOT;

  const Backdrop = ({ children }) => html`
    <div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm" onClick=${onClose}>
      <div onClick=${e => e.stopPropagation()}>${children}</div>
    </div>
  `;

  if (view === 'ban') return html`
    <${Backdrop}>
      <div class="bg-card border border-border/50 rounded-2xl p-6 w-[380px] shadow-2xl">
        <h3 class="text-sm font-semibold mb-1 flex items-center gap-2"><${Ico} d=${I.gavel} className="h-4 w-4 text-red-400"/>Ban — ${player.name}</h3>
        <p class="text-xs text-muted-foreground mb-4">This action will ban the player from the server.</p>
        <textarea class="w-full bg-input border border-border/50 rounded-lg p-3 text-sm text-foreground placeholder:text-muted-foreground outline-none focus:border-blue-500/50 resize-none mb-4"
          rows="3" placeholder="Ban reason (required)…" value=${reason} onInput=${e => setReason(e.target.value)} />
        <div class="flex gap-2">
          <button onClick=${() => setView('details')} class="flex-1 h-9 rounded-lg border border-border/50 text-sm text-muted-foreground hover:text-foreground transition-colors">Cancel</button>
          <button onClick=${() => { if(reason.trim()){ onAction('ban',player,reason); onClose(); } }}
            disabled=${!reason.trim()}
            class="flex-1 h-9 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-medium disabled:opacity-40 transition-colors">
            Ban Player
          </button>
        </div>
      </div>
    </${Backdrop}>
  `;

  if (view === 'kick') return html`
    <${Backdrop}>
      <div class="bg-card border border-border/50 rounded-2xl p-6 w-[380px] shadow-2xl">
        <h3 class="text-sm font-semibold mb-1 flex items-center gap-2"><${Ico} d=${I.ban} className="h-4 w-4 text-amber-400"/>Kick — ${player.name}</h3>
        <p class="text-xs text-muted-foreground mb-4">The player will be disconnected from the server.</p>
        <input class="w-full bg-input border border-border/50 rounded-lg px-3 py-2.5 text-sm text-foreground placeholder:text-muted-foreground outline-none focus:border-blue-500/50 mb-4"
          placeholder="Reason (optional)…" value=${reason} onInput=${e => setReason(e.target.value)} />
        <div class="flex gap-2">
          <button onClick=${() => setView('details')} class="flex-1 h-9 rounded-lg border border-border/50 text-sm text-muted-foreground hover:text-foreground transition-colors">Cancel</button>
          <button onClick=${() => { onAction('kick',player,reason); onClose(); }}
            class="flex-1 h-9 rounded-lg bg-amber-500 hover:bg-amber-400 text-black text-sm font-medium transition-colors">
            Kick Player
          </button>
        </div>
      </div>
    </${Backdrop}>
  `;

  return html`
    <${Backdrop}>
      <div class="bg-card border border-border/50 rounded-2xl w-[520px] shadow-2xl overflow-hidden">
        <div class="flex items-center justify-between px-6 py-4 border-b border-border/40">
          <div class="flex items-center gap-2">
            <${Ico} d=${I.eye} className="h-4 w-4 text-muted-foreground" />
            <h3 class="text-sm font-semibold">Player Details — ${player.name}</h3>
          </div>
          <button onClick=${onClose} class="h-7 w-7 rounded-md flex items-center justify-center text-muted-foreground hover:text-foreground hover:bg-white/5 transition-colors">
            <${Ico} d=${I.x} className="h-3.5 w-3.5" />
          </button>
        </div>
        <div class="p-6 space-y-5">
          <div class="grid grid-cols-2 gap-4">
            ${[['Player','name'],['ID','id'],['Status','status'],['Health','health'],['Ping','ping'],['Session','timeOnline'],['Play Time','playTime'],['Threat','threatScore']].map(([label,key]) => {
              let val = player[key];
              if (key==='status') val = (STATUS_CFG[val]||STATUS_CFG.ON_FOOT).label;
              if (key==='timeOnline'||key==='playTime') val = fmtMins(Math.floor((val||0)/60));
              if (key==='id') val = '#' + val;
              if (key==='health') val = (val||0) + '/200';
              if (key==='ping') val = val + 'ms';
              return html`<div key=${key}><p class="text-xs font-medium text-muted-foreground mb-1">${label}</p><p class="text-sm font-medium text-foreground">${String(val)}</p></div>`;
            })}
          </div>
          ${player.license && html`
            <div class="bg-muted/50 rounded-lg p-3">
              <p class="text-xs text-muted-foreground mb-1 font-medium">License</p>
              <p class="text-xs font-mono text-foreground/80 break-all">${player.license}</p>
            </div>
          `}
          <div class="space-y-2">
            <div class="flex gap-2">
              <button onClick=${() => { onAction('teleport',player); onClose(); }} class="flex-1 h-9 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-400 text-sm font-medium hover:bg-blue-500/20 transition-colors">Teleport</button>
              <button onClick=${() => { onAction('heal',player); onClose(); }} class="flex-1 h-9 rounded-lg bg-green-500/10 border border-green-500/20 text-green-400 text-sm font-medium hover:bg-green-500/20 transition-colors">Heal</button>
            </div>
            <div class="flex gap-2">
              <button onClick=${() => setView('kick')} class="flex-1 h-9 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-400 text-sm font-medium hover:bg-amber-500/20 transition-colors">Kick Player</button>
              <button onClick=${() => setView('ban')} class="flex-1 h-9 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm font-medium hover:bg-red-500/20 transition-colors">Ban Player</button>
            </div>
          </div>
        </div>
      </div>
    </${Backdrop}>
  `;
}

/* ─── Dashboard tab ───────────────────────────────────────────────────────── */
function DashboardTab({ players, bans, activity, serverInfo }) {
  const mapElRef = useRef(null);
  const mapRef = useRef(null);
  useEffect(function() { if (mapElRef.current && !mapRef.current) mapRef.current = makeMap(mapElRef.current); }, []);
  useLiveMarkers(players, mapRef);
  const suspicious = players.filter(function(p){ return (p.threatScore||0) > 70; }).length;

  const stats = [
    { label:'Players Online', val: players.length + '', sub:'/ ' + (serverInfo.maxSlots||'—'), icon:I.users, accent:'blue', bar: serverInfo.maxSlots>0 ? (players.length/serverInfo.maxSlots)*100 : 0 },
    { label:'Suspicious',     val: String(suspicious), sub:'threat score > 70', icon:I.alert, accent:'red'  },
    { label:'Total Bans',     val: String(bans.length), sub:'all time',          icon:I.ban,   accent:'amber'},

  return html`
    <div class="flex flex-col gap-5">
      <div class="relative overflow-hidden rounded-2xl border border-border/50 bg-card">
        <div class="absolute inset-0 opacity-[0.03]" style=${{ backgroundImage:'linear-gradient(to right,#e8edf5 1px,transparent 1px),linear-gradient(to bottom,#e8edf5 1px,transparent 1px)', backgroundSize:'40px 40px' }} />
        <div class=${'absolute -top-20 -right-20 h-64 w-64 rounded-full blur-3xl opacity-10 ' + (serverInfo.isOnline?'bg-blue-500':'bg-red-500')} />
        <div class="relative p-6 flex items-center gap-6">
          <div class=${'h-14 w-14 rounded-2xl flex items-center justify-center shrink-0 border ' + (serverInfo.isOnline?'bg-blue-500/10 border-blue-500/20':'bg-red-500/10 border-red-500/20')}>
            <${Ico} d=${I.shield} className=${'h-7 w-7 ' + (serverInfo.isOnline?'text-blue-400':'text-red-400')} />

          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              <h1 class="text-xl font-bold">${serverInfo.name || 'Server'}</h1>
              <span class=${'inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full border ' + (serverInfo.isOnline?'bg-green-500/10 border-green-500/30 text-green-400':'bg-zinc-500/10 border-zinc-500/30 text-zinc-400')}>
                <span class=${'h-1.5 w-1.5 rounded-full ' + (serverInfo.isOnline?'bg-green-400 animate-pulse-dot':'bg-zinc-400')} />
                ${serverInfo.isOnline?'Online':'Offline'}
              </span>
            </div>
            <p class="text-xs text-muted-foreground">v${serverInfo.version||'—'} · VexonAC Anti-Cheat</p>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        ${stats.map(function(s) { return html`
          <div key=${s.label} class=${'rounded-xl border border-border/50 bg-card p-5 flex flex-col gap-3 hover:border-' + s.accent + '-500/30 transition-colors'}>
            <div class="flex items-center justify-between">
              <span class="text-xs text-muted-foreground font-medium">${s.label}</span>
              <div class=${'h-7 w-7 rounded-lg bg-' + s.accent + '-500/10 flex items-center justify-center'}>
                <${Ico} d=${s.icon} className=${'h-3.5 w-3.5 text-' + s.accent + '-400'} />
              </div>
            </div>
            <div><span class="text-2xl font-bold tabular-nums">${s.val}</span>${s.sub && html`<span class="text-sm text-muted-foreground font-medium"> ${s.sub}</span>`}</div>
            ${s.bar !== undefined ? html`<div class="h-1 rounded-full bg-border/50 overflow-hidden"><div class=${'h-full rounded-full bg-' + s.accent + '-500'} style=${{ width: Math.min(100,s.bar) + '%' }} /></div>` : null}

          <div class="max-h-64 overflow-y-auto divide-y divide-border/30">

          </div>
          <div ref=${mapElRef} class="flex-1" style=${{ minHeight: 220 }} />
        </div>
      </div>
    </div>
  `;
}

/* ─── Players tab ─────────────────────────────────────────────────────────── */
function PlayersTab({ players, onAction, searchQuery }) {
  const filtered = useMemo(function() {
    return players.filter(function(p) { return !searchQuery || p.name.toLowerCase().includes(searchQuery.toLowerCase()) || String(p.id).includes(searchQuery); });
  }, [players, searchQuery]);

  if (!players.length) return html`
    <div class="flex flex-col items-center justify-center py-20 text-center">
      <${Ico} d=${I.users} className="h-16 w-16 text-muted-foreground/20 mb-4" />
      <h3 class="text-lg font-semibold">No players online</h3>
      <p class="text-sm text-muted-foreground mt-1">Players will appear here once they connect.</p>
    </div>
  `;
  return html`
    <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      ${filtered.map(function(p) { return html`<${PlayerCard} key=${p.id} player=${p} onAction=${onAction} />`; })}
      ${!filtered.length && html`<div class="col-span-4 py-12 text-center text-sm text-muted-foreground">No players match your search.</div>`}
    </div>
  `;
}

/* ─── Admin Chat tab ──────────────────────────────────────────────────────── */
function ChatTab({ messages, adminName, onSend, onlineAdmins }) {
  const [text, setText] = useState('');
  const [attachment, setAttachment] = useState(null);
  const [attachName, setAttachName] = useState('');
  const endRef = useRef(null);
  const fileRef = useRef(null);

  useEffect(function() { if (endRef.current) endRef.current.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  function send() {
    if (!text.trim() && !attachment) return;
    onSend(text.trim(), attachment);
    setText(''); setAttachment(null); setAttachName('');
  }

  function handleFile(e) {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = function(ev) { setAttachment(ev.target.result); setAttachName(f.name); };
    r.readAsDataURL(f);
    e.target.value = '';
  }

  return html`
    <div class="flex flex-col rounded-xl border border-border/50 bg-card overflow-hidden" style=${{ height:'calc(100vh - 180px)' }}>
      <div class="flex items-center justify-between px-4 py-3 border-b border-border/40 shrink-0">
        <div class="flex items-center gap-2 text-xs font-semibold"><${Ico} d=${I.chat} className="h-3.5 w-3.5 text-blue-400"/>Admin Chat</div>
        <div class="flex items-center gap-2 text-xs text-muted-foreground">
          <span class="w-1.5 h-1.5 rounded-full bg-green-400" />${onlineAdmins} admin${onlineAdmins!==1?'s':''} online
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        ${!messages.length
          ? html`<div class="flex flex-col items-center justify-center h-full text-center"><${Ico} d=${I.chat} className="h-12 w-12 text-muted-foreground/20 mb-3"/><p class="text-sm text-muted-foreground">No messages yet.</p></div>`
          : messages.map(function(m,i) {
              const isYou = m.sender === adminName;
              return html`
                <div key=${i} class="flex flex-col gap-1">
                  <div class="flex items-center gap-2">
                    <span class=${'text-xs font-bold ' + (isYou?'text-green-400':'text-blue-400')}>${m.sender}${isYou?' (You)':''}</span>
                    <span class="text-[10px] text-muted-foreground font-mono">${timeAgo(m.time)}</span>
                  </div>
                  ${m.text && html`<p class="text-sm text-foreground leading-relaxed">${m.text}</p>`}
                  ${m.evidence && html`
                    <div class="mt-1 rounded-lg border border-border/40 overflow-hidden max-w-[280px] cursor-pointer" onClick=${() => window.open(m.evidence,'_blank')}>
                      <img src=${m.evidence} alt="Evidence" class="w-full h-36 object-cover hover:opacity-85 transition-opacity" />
                      <div class="flex items-center gap-1.5 px-3 py-2 bg-muted/50 text-xs text-muted-foreground">
                        <${Ico} d=${I.camera} className="h-3 w-3"/>Screenshot — click to expand
                      </div>
                    </div>
                  `}
                </div>
              `;
            })
        }
        <div ref=${endRef} />
      </div>
      ${attachment && html`
        <div class="px-4 py-2 border-t border-border/40 flex items-center gap-2 text-xs text-muted-foreground shrink-0">
          <${Ico} d=${I.camera} className="h-3.5 w-3.5"/>
          <span class="flex-1 truncate">${attachName}</span>
          <button onClick=${() => { setAttachment(null); setAttachName(''); }} class="text-lg leading-none hover:text-foreground">×</button>
        </div>
      `}
      <div class="flex items-center gap-2 p-3 border-t border-border/40 shrink-0">
        <input type="file" ref=${fileRef} accept="image/*" style=${{ display:'none' }} onChange=${handleFile} />
        <button onClick=${() => fileRef.current && fileRef.current.click()}
          class="h-9 w-9 rounded-lg border border-border/50 bg-input flex items-center justify-center text-muted-foreground hover:text-foreground hover:border-border transition-colors shrink-0">
          <${Ico} d=${I.clip} className="h-3.5 w-3.5" />
        </button>
        <input class="flex-1 h-9 bg-input border border-border/50 rounded-lg px-3 text-sm text-foreground placeholder:text-muted-foreground outline-none focus:border-blue-500/50 transition-colors"
          placeholder="Message admins…" value=${text} onInput=${e => setText(e.target.value)}
          onKeyDown=${e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } }} />
        <button onClick=${send}
          class="h-9 w-9 rounded-lg bg-blue-600 hover:bg-blue-500 flex items-center justify-center text-white shrink-0 transition-colors">
          <${Ico} d=${I.send} className="h-3.5 w-3.5" />
        </button>
      </div>
    </div>
  `;
}

function DetectionsTab({ detections, onBan }) {

      ${!detections.length
        ? html`<div class="py-16 text-center"><${Ico} d=${I.alert} className="h-10 w-10 text-muted-foreground/20 mx-auto mb-3"/><p class="text-sm text-muted-foreground">No detections recorded</p></div>`
        : html`<div class="overflow-x-auto"><table class="w-full text-sm">
            <thead><tr class="border-b border-border/40">${['#','Player','Type','Details','Severity','Time',''].map(function(h2){return html`<th key=${h2} class="px-4 py-2.5 text-left text-[10px] font-semibold text-muted-foreground/70 uppercase tracking-wider">${h2}</th>`;})}</tr></thead>
            <tbody class="divide-y divide-border/30">
              ${detections.map(function(d,i){ return html`
                <tr key=${i} class="hover:bg-white/[.02]">
                  <td class="px-4 py-3 text-xs text-muted-foreground font-mono">${d.id||i+1}</td>
                  <td class="px-4 py-3 font-semibold">${d.player}</td>
                  <td class="px-4 py-3"><span class="font-mono text-[10px] font-bold text-red-400 bg-red-500/10 px-2 py-0.5 rounded">${d.type}</span></td>
                  <td class="px-4 py-3 text-xs text-muted-foreground max-w-[180px] truncate">${d.details}</td>
                  <td class="px-4 py-3"><span class=${'text-[10px] font-bold px-2 py-0.5 rounded-full border ' + (d.severity==='critical'?'bg-red-500/10 border-red-500/30 text-red-400':'bg-amber-500/10 border-amber-500/30 text-amber-400')}>${(d.severity||'').toUpperCase()}</span></td>
                  <td class="px-4 py-3 text-xs text-muted-foreground font-mono">${timeAgo(d.time)}</td>
                  <td class="px-4 py-3"><button onClick=${()=>onBan(d.player)} class="text-xs font-medium px-2.5 py-1 rounded-md bg-red-500/10 text-red-400 hover:bg-red-500/20 border border-red-500/20 transition-colors">Ban</button></td>
                </tr>
              `; })}
            </tbody>
          </table></div>`
      }
    </div>
  `;
}

/* ─── Bans tab ────────────────────────────────────────────────────────────── */
function BansTab({ bans, onUnban }) {
  return html`
    <div class="rounded-xl border border-border/50 bg-card overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-border/40">
        <div class="flex items-center gap-2 text-xs font-semibold"><${Ico} d=${I.ban} className="h-3.5 w-3.5 text-red-400"/>Ban Records</div>
        <span class="text-xs text-muted-foreground">${bans.length} total</span>
      </div>
      ${!bans.length
        ? html`<div class="py-16 text-center"><${Ico} d=${I.ban} className="h-10 w-10 text-muted-foreground/20 mx-auto mb-3"/><p class="text-sm text-muted-foreground">No bans recorded</p></div>`
        : html`<div class="overflow-x-auto"><table class="w-full text-sm">
            <thead><tr class="border-b border-border/40">${['Ban ID','Player','Reason','Banned By','Expires','Date',''].map(function(h2){return html`<th key=${h2} class="px-4 py-2.5 text-left text-[10px] font-semibold text-muted-foreground/70 uppercase tracking-wider">${h2}</th>`;})}</tr></thead>
            <tbody class="divide-y divide-border/30">
              ${bans.map(function(b,i){ return html`
                <tr key=${i} class="hover:bg-white/[.02]">
                  <td class="px-4 py-3 font-mono text-xs text-blue-400">${b.banId||('#'+(i+1))}</td>
                  <td class="px-4 py-3 font-semibold">${b.playerName}</td>
                  <td class="px-4 py-3 text-xs text-red-400 max-w-[160px] truncate">${b.reason}</td>
                  <td class="px-4 py-3 text-xs text-muted-foreground">${b.bannedBy}</td>
                  <td class="px-4 py-3 text-xs text-muted-foreground">${b.expiresAt?fmtDate(b.expiresAt):'Permanent'}</td>
                  <td class="px-4 py-3 text-xs text-muted-foreground">${b.bannedAt?fmtDate(b.bannedAt):'—'}</td>
                  <td class="px-4 py-3"><button onClick=${()=>onUnban(b)} class="text-xs font-medium px-2.5 py-1 rounded-md bg-green-500/10 text-green-400 hover:bg-green-500/20 border border-green-500/20 transition-colors">Unban</button></td>
                </tr>
              `; })}
            </tbody>
          </table></div>`
      }
    </div>
  `;
}

/* ─── Logs tab ────────────────────────────────────────────────────────────── */
function LogsTab({ activity }) {
  return html`
    <div class="rounded-xl border border-border/50 bg-card overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-border/40">
        <div class="flex items-center gap-2 text-xs font-semibold"><${Ico} d=${I.file} className="h-3.5 w-3.5 text-blue-400"/>Server Logs</div>
        <${LiveBadge} />
      </div>
      ${!activity.length
        ? html`<div class="py-16 text-center"><${Ico} d=${I.file} className="h-10 w-10 text-muted-foreground/20 mx-auto mb-3"/><p class="text-sm text-muted-foreground">No activity yet</p></div>`
        : html`<div class="divide-y divide-border/30">
            ${activity.map(function(a,i){ return html`
              <div key=${i} class="flex items-start gap-3 px-4 py-3">
                <div class=${'mt-0.5 w-6 h-6 rounded-md flex items-center justify-center shrink-0 ' + (a.type==='ban'?'bg-red-500/10 text-red-400':a.type==='detect'?'bg-violet-500/10 text-violet-400':a.type==='join'?'bg-green-500/10 text-green-400':'bg-amber-500/10 text-amber-400')}>
                  <${Ico} d=${a.type==='ban'?I.ban:a.type==='detect'?I.alert:I.users} className="h-3 w-3"/>
                </div>
                <p class="flex-1 text-sm text-foreground leading-snug" dangerouslySetInnerHTML=${{ __html: a.text }} />
                <span class="text-[10px] text-muted-foreground font-mono shrink-0">${timeAgo(a.time)}</span>
              </div>
            `; })}
          </div>`
      }
    </div>
  `;
}

/* ─── Map tab ─────────────────────────────────────────────────────────────── */
function MapTab({ players }) {
  const mapElRef = useRef(null);
  const mapRef = useRef(null);
  useEffect(function() {
    if (mapElRef.current && !mapRef.current) mapRef.current = makeMap(mapElRef.current);
  }, []);
  useLiveMarkers(players, mapRef);
  return html`
    <div class="rounded-xl border border-border/50 bg-card overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-border/40">
        <div class="flex items-center gap-2 text-xs font-semibold"><${Ico} d=${I.map} className="h-3.5 w-3.5 text-blue-400"/>Live Map</div>
        <span class="text-xs text-muted-foreground">${players.length} players</span>
      </div>
      <div ref=${mapElRef} style=${{ height:'calc(100vh - 220px)', minHeight:400 }} />
    </div>
  `;
}

/* ─── Settings tab ────────────────────────────────────────────────────────── */
function SettingsTab({ keybind, setKeybind, serverInfo }) {
  const [listening, setListening] = useState(false);

  useEffect(function() {
    if (!listening) return;
    function handler(e) {
      e.preventDefault();
      if (e.key === 'Escape') { setListening(false); return; }
      const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
      setKeybind(k);
      localStorage.setItem('vexonac_kb', k);
      setListening(false);
    }
    window.addEventListener('keydown', handler);
    return function() { window.removeEventListener('keydown', handler); };
  }, [listening]);

  return html`
    <div class="max-w-lg space-y-5">
      <div class="rounded-xl border border-border/50 bg-card p-6">
        <h3 class="text-sm font-semibold mb-1">Toggle Keybind</h3>
        <p class="text-xs text-muted-foreground mb-4">Press the button, then press any key to assign a new keybind.</p>
        <div class="flex items-center gap-3">
          <div class="bg-input border border-border/50 rounded-lg px-5 py-3 font-mono text-lg font-bold text-blue-400 min-w-[80px] text-center">${listening?'…':keybind}</div>
          <button onClick=${() => setListening(true)}
            class=${'h-10 px-4 rounded-lg text-sm font-medium transition-colors ' + (listening?'bg-blue-600 text-white':'bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 border border-blue-500/20')}>
            ${listening?'Press any key…':'Change keybind'}
          </button>
        </div>
        <p class="text-xs text-muted-foreground mt-3">Also via <code class="font-mono bg-input px-1.5 py-0.5 rounded text-xs">/vadmin</code> in chat.</p>
      </div>
      <div class="rounded-xl border border-border/50 bg-card p-6">
        <h3 class="text-sm font-semibold mb-3">Server Information</h3>
        <div class="space-y-2 text-sm">
          ${[['Name', serverInfo.name||'—'], ['Version', serverInfo.version||'—'], ['Max Slots', serverInfo.maxSlots||'—'], ['Status', serverInfo.isOnline?'Online':'Offline']].map(function(pair){
            return html`
              <div key=${pair[0]} class="flex justify-between">
                <span class="text-muted-foreground">${pair[0]}</span>
                <span class=${'font-medium ' + (pair[0]==='Status'?(serverInfo.isOnline?'text-green-400':'text-red-400'):'')}>${String(pair[1])}</span>
              </div>
            `;
          })}
        </div>
      </div>
      <div class="rounded-xl border border-border/50 bg-card p-6">
        <h3 class="text-sm font-semibold mb-3">FiveM Commands</h3>
        <div class="bg-input rounded-lg p-4 font-mono text-xs text-muted-foreground space-y-1.5">
          <div>/vadmin  — Toggle HUD</div>
          <div>/noclip  — Toggle noclip</div>
          <div>/invis   — Toggle invisibility</div>
          <div>/freecam — Toggle freecam</div>
        </div>
      </div>
    </div>
  `;
}

/* ─── App ─────────────────────────────────────────────────────────────────── */
function App() {
  const [visible, setVisible]           = useState(false);
  const [tab, setTab]                   = useState('dashboard');
  const [searchQuery, setSearchQuery]   = useState('');
  const [keybind, setKeybind]           = useState(function() { return localStorage.getItem('vexonac_kb') || 'F2'; });
  const [players, setPlayers]           = useState([]);
  const [bans, setBans]                 = useState([]);
  const [activity, setActivity]         = useState([]);
  const [detections, setDetections]     = useState([]);
  const [chatMessages, setChatMessages] = useState([]);
  const [chatUnread, setChatUnread]     = useState(0);
  const [adminName, setAdminName]       = useState('');
  const [serverInfo, setServerInfo]     = useState({ name:'', version:'', maxSlots:0, isOnline:false });
  const [detailPlayer, setDetailPlayer] = useState(null);

  const [pos, setPos] = useState(function() {
    const ww = window.innerWidth || 1920, wh = window.innerHeight || 1080;
    return { x: Math.max(0, (ww - Math.min(1400, ww*0.98)) / 2), y: Math.max(0, (wh - Math.min(870, wh*0.96)) / 2) };
  });
  const dragRef = useRef({ active:false, startX:0, startY:0, origX:0, origY:0 });
  const tabRef  = useRef(tab);
  useEffect(function() { tabRef.current = tab; }, [tab]);

  /* NUI messages */
  useEffect(function() {
    function onMsg(e) {
      const type = e.data && e.data.type;
      const d    = e.data && e.data.data;
      switch (type) {
        case 'openHud':          setVisible(true);  nuiCb('hudOpened',{}); break;
        case 'closeHud':         setVisible(false); break;
        case 'toggleHud':        setVisible(function(v){ return !v; }); break;
        case 'setAdmin':         if (d && d.name) setAdminName(d.name); break;
        case 'setServer':        if (d) setServerInfo(function(p){ return Object.assign({},p,d); }); break;
        case 'serverOnline':     if (d) setServerInfo(function(p){ return Object.assign({},p,{ isOnline:!!d.online }); }); break;
        case 'setPlayers':       if (Array.isArray(d)) setPlayers(d); break;
        case 'updatePlayer':     if (d && d.id) setPlayers(function(p){ return p.map(function(x){ return x.id===d.id ? Object.assign({},x,d) : x; }); }); break;
        case 'setBans':          if (Array.isArray(d)) setBans(d); break;
        case 'addBan':           if (d) setBans(function(p){ return [d].concat(p); }); break;
        case 'setDetections':    if (Array.isArray(d)) setDetections(d); break;
        case 'addDetection':     if (d) setDetections(function(p){ return [Object.assign({},d,{time:new Date()})].concat(p).slice(0,500); }); break;
        case 'setActivity':      if (Array.isArray(d)) setActivity(d); break;
        case 'addActivity':      if (d) setActivity(function(p){ return [Object.assign({},d,{time:new Date()})].concat(p).slice(0,200); }); break;
        case 'adminChatMessage': if (d) { setChatMessages(function(p){ return p.concat([Object.assign({},d,{time:new Date()})]); }); if (tabRef.current!=='chat') setChatUnread(function(n){ return n+1; }); } break;
      }
    }
    window.addEventListener('message', onMsg);
    return function() { window.removeEventListener('message', onMsg); };
  }, []);

  /* Keybind */
  useEffect(function() {
    function onKey(e) {
      if (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
      const k = e.key.length===1 ? e.key.toUpperCase() : e.key;
      if (k === keybind) { setVisible(function(v){ nuiCb(v?'hudClosed':'hudOpened',{}); return !v; }); }
    }
    window.addEventListener('keydown', onKey);
    return function() { window.removeEventListener('keydown', onKey); };
  }, [keybind]);

  /* Drag */
  useEffect(function() {
    function onMove(e) {
      if (!dragRef.current.active) return;
      setPos({ x: Math.max(0, dragRef.current.origX + e.clientX - dragRef.current.startX), y: Math.max(0, dragRef.current.origY + e.clientY - dragRef.current.startY) });
    }
    function onUp() { dragRef.current.active = false; }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return function() { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, []);

  function onDragStart(e) {
    if (e.button !== 0 || (e.target.closest && e.target.closest('button,input,textarea'))) return;
    dragRef.current = { active:true, startX:e.clientX, startY:e.clientY, origX:pos.x, origY:pos.y };
    e.preventDefault();
  }

  function switchTab(t) { setTab(t); if (t==='chat') setChatUnread(0); }

  function handlePlayerAction(type, player, extra) {
    if (type === 'details') { setDetailPlayer(player); return; }
    const actions = { teleport:['teleport',{playerId:player.id,playerName:player.name}], heal:['heal',{playerId:player.id}], kick:['kick',{playerId:player.id,reason:extra||'Kicked by admin'}], ban:['ban',{playerId:player.id,playerName:player.name,reason:extra}] };
    if (actions[type]) nuiCb(actions[type][0], actions[type][1]);
  }

  function handleUnban(ban)          { nuiCb('unban', { banId:ban.banId, playerName:ban.playerName }); }
  function handleQuickBan(playerName){ nuiCb('ban', { playerName, reason:'Detected by anti-cheat' }); }

  function handleChatSend(text, evidence) {
    setChatMessages(function(p){ return p.concat([{ sender:adminName||'Admin', text, evidence:evidence||null, time:new Date(), you:true }]); });
    nuiCb('adminChat', { message:text, sender:adminName, evidence:!!evidence });
  }

  function closeHud() { setVisible(false); nuiCb('hudClosed',{}); }

  if (!visible) return null;

  return html`
    <div style=${{ position:'fixed', inset:0, zIndex:9999, pointerEvents:'none' }}>
      <div style=${{ position:'absolute', left:pos.x, top:pos.y, width:'min(1400px,98vw)', height:'min(870px,96vh)', pointerEvents:'auto', display:'grid', gridTemplateColumns:'240px 1fr', background:'#0c0f16e8', border:'1px solid rgba(29,38,55,0.7)', borderRadius:'16px', overflow:'hidden', boxShadow:'0 0 0 1px rgba(34,211,238,.06), 0 32px 80px rgba(0,0,0,.8)', backdropFilter:'blur(6px)' }}>

        <${Sidebar} tab=${tab} setTab=${switchTab} adminName=${adminName} serverName=${serverInfo.name}
          serverOnline=${serverInfo.isOnline} keybind=${keybind}
          detectionCount=${detections.length} chatUnread=${chatUnread} />

        <div style=${{ display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0 }}>
          <${TopBar} tab=${tab} serverOnline=${serverInfo.isOnline} onClose=${closeHud}
            searchQuery=${searchQuery} setSearchQuery=${setSearchQuery} onDragStart=${onDragStart} />
          <div style=${{ flex:1, overflowY:'auto', padding:'20px' }}>
            ${tab==='dashboard'  && html`<${DashboardTab}  players=${players} bans=${bans} activity=${activity} serverInfo=${serverInfo} />`}
            ${tab==='players'    && html`<${PlayersTab}    players=${players} onAction=${handlePlayerAction} searchQuery=${searchQuery} />`}
            ${tab==='chat'       && html`<${ChatTab}       messages=${chatMessages} adminName=${adminName||'Admin'} onSend=${handleChatSend} onlineAdmins=${players.filter(function(p){return p.admin;}).length+1} />`}
            ${tab==='detections' && html`<${DetectionsTab} detections=${detections} onBan=${handleQuickBan} />`}
            ${tab==='bans'       && html`<${BansTab}       bans=${bans} onUnban=${handleUnban} />`}
            ${tab==='logs'       && html`<${LogsTab}       activity=${activity} />`}
            ${tab==='map'        && html`<${MapTab}        players=${players} />`}
            ${tab==='settings'   && html`<${SettingsTab}   keybind=${keybind} setKeybind=${setKeybind} serverInfo=${serverInfo} />`}
          </div>
        </div>
      </div>

      ${detailPlayer && html`
        <div style=${{ pointerEvents:'auto' }}>
          <${PlayerDetailModal} player=${detailPlayer} onClose=${() => setDetailPlayer(null)} onAction=${handlePlayerAction} />
        </div>
      `}
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
