<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="VexonAC Anti-cheat service status page" />
    <meta name="theme-color" content="#05c2c9" />
    <title>VexonAC Status</title>
    <link rel="icon" href="https://vexonac.com/icon.png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --bg: #070b13;
        --primary: #0b111e;
        --surface: #0d1422;
        --surface-2: #111a2a;
        --line: rgba(178, 189, 205, 0.13);
        --line-strong: rgba(5, 194, 201, 0.28);
        --text: #f6f9ff;
        --muted: #b2bdcd;
        --soft: #738198;
        --accent: #05c2c9;
        --accent-2: #39d7dd;
        --green: #22c55e;
        --yellow: #f59e0b;
        --orange: #fb923c;
        --red: #ef4444;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      }

      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(
            180deg,
            rgba(11, 17, 30, 0.98),
            rgba(7, 11, 19, 1) 34%
          ),
          radial-gradient(
            circle at 50% -10%,
            rgba(5, 194, 201, 0.12),
            transparent 34%
          );
        color: var(--text);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.045;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.3) 1px, transparent 1px);
        background-size: 42px 42px;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
      }

      .shell {
        width: min(100% - 32px, 860px);
        margin: 0 auto;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(7, 11, 19, 0.82);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }

      .nav {
        height: 86px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .brand img {
        width: 42px;
        height: 42px;
        object-fit: contain;
        filter: drop-shadow(0 0 18px rgba(5, 194, 201, 0.22));
      }
      .brand-mark {
        line-height: 1;
      }
      .brand-title {
        display: block;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }
      .brand-sub {
        display: block;
        margin-top: 4px;
        color: var(--accent-2);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
      }
      .text-link {
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
      }
      .text-link:hover {
        color: var(--accent-2);
      }
      .btn {
        height: 38px;
        border-radius: 7px;
        border: 1px solid var(--line-strong);
        color: var(--text);
        background: rgba(5, 194, 201, 0.08);
        padding: 0 15px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
      }
      .btn:hover {
        background: rgba(5, 194, 201, 0.15);
        box-shadow: 0 0 18px rgba(5, 194, 201, 0.18);
      }

      .updates-menu {
        position: absolute;
        top: 48px;
        right: 0;
        width: 210px;
        padding: 10px;
        background: rgba(10, 16, 28, 0.98);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        display: none;
      }
      .updates-menu.open {
        display: block;
      }
      .menu-item {
        min-height: 42px;
        border-radius: 6px;
        padding: 0 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .menu-item:hover {
        background: rgba(255, 255, 255, 0.045);
        color: var(--text);
      }
      .menu-item svg {
        width: 16px;
        height: 16px;
        color: var(--text);
        opacity: 0.9;
      }

      main {
        padding: 52px 0 80px;
      }

      .panel {
        background: rgba(7, 11, 19, 0.86);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 130px;
        padding: 28px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(
          180deg,
          rgba(13, 20, 34, 0.82),
          rgba(7, 11, 19, 0.18)
        );
        text-align: center;
      }

      .status-orb {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 194, 201, 0.15);
        color: var(--accent-2);
        box-shadow: 0 0 24px rgba(5, 194, 201, 0.22);
        flex: 0 0 auto;
      }
      .status-title {
        font-size: 19px;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .status-desc {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .content {
        padding: 26px 32px 0;
      }
      .section {
        margin-bottom: 30px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }
      .section-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chev {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        background: var(--muted);
      }
      .uptime-value {
        color: var(--accent-2);
      }

      .uptime-bars {
        height: 39px;
        display: grid;
        grid-template-columns: repeat(90, 1fr);
        gap: 2px;
        margin: 0 0 8px;
      }
      .uptime-bar {
        min-width: 2px;
        border-radius: 2px;
        background: rgba(178, 189, 205, 0.66);
        border: 0;
        padding: 0;
      }
      .uptime-bar.good {
        background: linear-gradient(
          180deg,
          rgba(57, 215, 221, 0.95),
          rgba(5, 194, 201, 0.46)
        );
      }
      .uptime-bar.warn {
        background: linear-gradient(
          180deg,
          rgba(245, 158, 11, 0.92),
          rgba(245, 158, 11, 0.45)
        );
      }
      .uptime-bar.bad {
        background: linear-gradient(
          180deg,
          rgba(239, 68, 68, 0.95),
          rgba(239, 68, 68, 0.42)
        );
      }
      .uptime-bar {
        cursor: pointer;
      }
      .uptime-bar.active {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .months {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        color: var(--muted);
        font-size: 12px;
      }
      .months span:nth-child(2) {
        text-align: center;
      }
      .months span:nth-child(3) {
        text-align: right;
      }

      .uptime-detail {
        margin-top: 12px;
        padding: 20px 12px 18px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(5, 194, 201, 0.08);
        text-align: center;
        cursor: pointer;
      }
      .uptime-detail-date {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 26px;
      }
      .uptime-detail-state {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-weight: 800;
        font-size: 16px;
      }
      .uptime-detail-line {
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        margin-top: 34px;
        box-shadow: 0 0 18px rgba(5, 194, 201, 0.24);
      }

      .services-box {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: rgba(13, 20, 34, 0.35);
      }
      .service-group {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }
      .service-group:last-child {
        border-bottom: 0;
      }
      .group-title {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-weight: 800;
        margin-bottom: 14px;
      }
      .service-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        min-height: 34px;
        color: var(--muted);
        font-weight: 650;
      }
      .service-name {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .status-pill {
        color: var(--accent-2);
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
      }
      .status-pill.warn {
        color: var(--yellow);
      }
      .status-pill.bad {
        color: #fda4af;
      }
      .status-pill.maint {
        color: #93c5fd;
      }
      .tiny-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        background: rgba(5, 194, 201, 0.16);
        color: var(--accent-2);
      }

      .notice-title {
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 54px 0 30px;
      }
      .month-block {
        margin-bottom: 48px;
      }
      .month-head {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 20px;
        color: var(--text);
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 26px;
      }
      .month-head::after {
        content: "";
        height: 1px;
        background: var(--line);
      }

      .notice-empty {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--muted);
        min-height: 44px;
      }

      .notice-alert {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 16px;
        background: rgba(13, 20, 34, 0.48);
        cursor: pointer;
      }
      .notice-alert:hover {
        border-color: var(--line-strong);
      }
      .notice-alert.minor {
        border-color: rgba(245, 158, 11, 0.35);
        background: rgba(245, 158, 11, 0.055);
      }
      .notice-alert.major {
        border-color: rgba(251, 146, 60, 0.38);
        background: rgba(251, 146, 60, 0.06);
      }
      .notice-alert.critical {
        border-color: rgba(239, 68, 68, 0.42);
        background: rgba(239, 68, 68, 0.065);
      }
      .notice-alert.none {
        border-color: rgba(5, 194, 201, 0.3);
        background: rgba(5, 194, 201, 0.055);
      }
      .notice-alert-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 10px;
      }
      .notice-alert-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 800;
      }
      .severity-badge {
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--accent-2);
        background: rgba(5, 194, 201, 0.12);
      }
      .severity-badge.minor {
        color: #fcd34d;
        background: rgba(245, 158, 11, 0.14);
      }
      .severity-badge.major {
        color: #fdba74;
        background: rgba(251, 146, 60, 0.14);
      }
      .severity-badge.critical {
        color: #fda4af;
        background: rgba(239, 68, 68, 0.14);
      }
      .notice-alert-message {
        color: var(--muted);
        line-height: 1.65;
      }
      .notice-alert-meta {
        color: var(--soft);
        font-size: 12px;
        margin-top: 12px;
      }

      .notice-card {
        position: relative;
        padding: 0 0 34px;
      }
      .notice-card + .notice-card {
        margin-top: 20px;
      }
      .notice-summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 18px;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }
      .notice-name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 800;
      }
      .notice-chevron {
        color: var(--soft);
      }
      .timeline {
        display: grid;
        grid-template-columns: 122px 1fr;
        gap: 24px;
        position: relative;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 61px;
        top: 30px;
        bottom: -10px;
        width: 1px;
        background: var(--line);
      }
      .timeline:last-child::before {
        display: none;
      }
      .timeline-badge {
        height: 34px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: rgba(7, 11, 19, 0.94);
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        font-size: 12px;
        font-weight: 750;
        position: relative;
        z-index: 1;
      }
      .timeline-badge.resolved,
      .timeline-badge.completed {
        background: var(--text);
        color: var(--primary);
        border-color: transparent;
      }
      .timeline-text {
        color: var(--muted);
        line-height: 1.6;
        padding-top: 2px;
      }
      .timeline-time {
        color: var(--soft);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 2px;
      }

      .footer-strip {
        height: 66px;
        border-top: 1px solid var(--line);
        background: rgba(13, 20, 34, 0.42);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        color: var(--muted);
        font-weight: 800;
        font-size: 13px;
      }
      .arrow-btn {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .arrow-btn:hover {
        color: var(--accent-2);
      }

      .loading,
      .error {
        padding: 68px 24px;
        text-align: center;
        color: var(--muted);
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 14px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hide {
        display: none;
      }

      @media (max-width: 720px) {
        .shell {
          width: min(100% - 24px, 860px);
        }
        .nav {
          height: auto;
          padding: 16px 0;
          align-items: flex-start;
        }
        .brand img {
          width: 36px;
          height: 36px;
        }
        .brand-title {
          font-size: 16px;
        }
        .brand-sub {
          font-size: 9px;
        }
        .nav-actions {
          gap: 8px;
          flex-wrap: wrap;
          justify-content: flex-end;
        }
        .text-link {
          display: none;
        }
        main {
          padding-top: 28px;
        }
        .hero-status {
          min-height: 116px;
          padding: 22px 16px;
        }
        .status-title {
          font-size: 17px;
        }
        .content {
          padding: 22px 16px 0;
        }
        .uptime-bars {
          height: 30px;
          gap: 1px;
          grid-template-columns: repeat(60, 1fr);
        }
        .months {
          font-size: 10px;
        }
        .service-row {
          grid-template-columns: 1fr;
          gap: 2px;
          padding: 6px 0;
        }
        .status-pill {
          padding-left: 24px;
        }
        .timeline {
          grid-template-columns: 92px 1fr;
          gap: 14px;
        }
        .timeline::before {
          left: 46px;
        }
        .timeline-badge {
          font-size: 11px;
          padding: 0 10px;
        }
        .footer-strip {
          padding: 0 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell nav">
        <a href="https://vexonac.com" class="brand" aria-label="VexonAC home">
          <img src="https://vexonac.com/icon.png" alt="" />
          <span class="brand-mark">
            <span class="brand-title">VexonAC</span>
            <span class="brand-sub">Anti-cheat status</span>
          </span>
        </a>
        <div class="nav-actions">
          <a
            class="text-link"
            href="https://discord.gg/ejGGj44RYm"
            target="_blank"
            rel="noopener noreferrer"
            >Report an issue</a
          >
          <button
            class="btn"
            id="updates-btn"
            type="button"
            aria-expanded="false"
            aria-controls="updates-menu"
          >
            Get updates
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <div class="updates-menu" id="updates-menu">
            <a class="menu-item" href="mailto:support@vexonac.com">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm9 8.2L4.8 7H4v.4l8 6.9 8-6.9V7h-.8L12 13.2Z"
                />
              </svg>
              Email
            </a>
            <a
              class="menu-item"
              href="https://discord.gg/ejGGj44RYm"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M20.3 5.4A16.9 16.9 0 0 0 16.1 4l-.2.4c1.5.4 2.2 1 2.2 1s-1.8-1-5.4-1c-3.6 0-5.4 1-5.4 1s.8-.7 2.3-1L9.4 4a17 17 0 0 0-4.2 1.4C2.5 9.3 1.8 13.1 2.1 16.8A16.7 16.7 0 0 0 7.2 19l.6-.8c-1.1-.4-2-1.2-2-1.2s.2.1.5.3c2.2 1.2 4.8 1.6 7.7 1.1 1.2-.2 2.5-.6 3.8-1.4 0 0-.9.8-2.1 1.2l.6.8a16.7 16.7 0 0 0 5.1-2.2c.4-4.3-.7-8-2.9-11.4ZM8.9 14.8c-1 0-1.7-.9-1.7-1.9s.8-1.9 1.7-1.9c1 0 1.8.9 1.7 1.9 0 1-.8 1.9-1.7 1.9Zm6.3 0c-1 0-1.7-.9-1.7-1.9s.8-1.9 1.7-1.9c1 0 1.8.9 1.7 1.9 0 1-.8 1.9-1.7 1.9Z"
                />
              </svg>
              Discord
            </a>
            <a
              class="menu-item"
              href="https://docs.vexonac.com"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="m16 18 6-6-6-6" />
                <path d="m8 6-6 6 6 6" />
                <path d="m14.5 4-5 16" />
              </svg>
              API
            </a>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="shell panel">
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <div>Loading VexonAC status...</div>
        </div>

        <div id="app" class="hide">
          <section class="hero-status">
            <span class="status-orb" id="status-orb"></span>
            <div>
              <h1 class="status-title" id="status-title">Checking systems</h1>
              <p class="status-desc" id="status-desc">
                Fetching the latest status data.
              </p>
            </div>
          </section>

          <div class="content">
            <section class="section">
              <div class="section-head">
                <span class="section-label"
                  ><span class="chev">›</span> Locations</span
                >
                <span class="uptime-value" id="locations-uptime"
                  >100.0% uptime</span
                >
              </div>
              <div class="uptime-bars" id="locations-bars"></div>
              <div class="months" id="locations-months"></div>
              <div
                class="uptime-detail"
                id="locations-detail"
                role="button"
                tabindex="0"
              ></div>
            </section>

            <section class="section">
              <div class="section-head">
                <span class="section-label"
                  ><span class="chev">›</span> Services</span
                >
                <span class="uptime-value" id="services-uptime"
                  >100.0% uptime</span
                >
              </div>
              <div class="uptime-bars" id="services-bars"></div>
              <div class="months" id="services-months"></div>
            </section>

            <section class="section">
              <div class="services-box" id="services-box"></div>
            </section>

            <div class="notice-title">Recent Notices</div>
            <section id="recent-notices"></section>
            <section id="notice-history" class="hide"></section>
          </div>

          <div class="footer-strip">
            <button
              class="arrow-btn"
              id="prev-period"
              type="button"
              aria-label="Previous period"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
            <button
              class="arrow-btn"
              id="history-toggle"
              type="button"
              style="width: auto; padding: 0 12px"
            >
              Show notice history
            </button>
            <span id="period-label">Current month</span>
            <button
              class="arrow-btn"
              id="next-period"
              type="button"
              aria-label="Next period"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      const API = "https://api.vexonac.com/trpc/status.getPublic";

      const SERVICES = [
        {
          name: "VexonAC Platform",
          items: [
            "Customer Panel",
            "Server API",
            "Ingress API",
            "Documentation",
          ],
        },
        {
          name: "FiveM Protection",
          items: [
            "License Authentication",
            "Client Verification",
            "Ban Sync",
            "Configuration Delivery",
          ],
        },
      ];

      const STATUS = {
        operational: {
          title: "All systems operational",
          desc: "VexonAC services are running normally.",
          icon: checkIcon(),
          label: "Operational",
          tone: "good",
        },
        degraded: {
          title: "Degraded performance",
          desc: "Some services are responding slower than usual.",
          icon: alertIcon("yellow"),
          label: "Degraded",
          tone: "warn",
        },
        partial_outage: {
          title: "Partial service outage",
          desc: "Some VexonAC services are currently affected.",
          icon: alertIcon("orange"),
          label: "Partial outage",
          tone: "warn",
        },
        major_outage: {
          title: "Major service outage",
          desc: "Critical VexonAC systems are unavailable.",
          icon: xIcon(),
          label: "Major outage",
          tone: "bad",
        },
        maintenance: {
          title: "Maintenance in progress",
          desc: "Scheduled maintenance is currently underway.",
          icon: wrenchIcon(),
          label: "Maintenance",
          tone: "maint",
        },
      };

      let selectedPeriod = new Date();
      let selectedDayIndex = 89;
      let lastStatusData = null;
      let historyVisible = false;

      function checkIcon() {
        return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m20 6-11 11-5-5"/></svg>';
      }
      function xIcon() {
        return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
      }
      function wrenchIcon() {
        return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.8-2.8 2.4-2.8Z"/></svg>';
      }
      function alertIcon() {
        return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="m10.3 3.9-8.1 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.1l-8.1-14a2 2 0 0 0-3.4 0Z"/></svg>';
      }
      function externalIcon() {
        return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>';
      }

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmtDate(value) {
        return new Date(value).toLocaleString("en-US", {
          month: "long",
          day: "numeric",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });
      }

      function monthLabel(value) {
        return new Date(value).toLocaleString("en-US", {
          month: "short",
          year: "numeric",
        });
      }

      function periodLabel(value, mode = "long") {
        return value.toLocaleString("en-US", { month: mode, year: "numeric" });
      }

      function addMonths(value, amount) {
        const next = new Date(value);
        next.setMonth(next.getMonth() + amount);
        return next;
      }

      function getPeriodMonths() {
        return [
          addMonths(selectedPeriod, -2),
          addMonths(selectedPeriod, -1),
          selectedPeriod,
        ];
      }

      function statusLabel(value) {
        return String(value || "update")
          .replace(/_/g, " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function buildBars(id, tone) {
        const el = document.getElementById(id);
        const count = window.matchMedia("(max-width: 720px)").matches ? 60 : 90;
        let html = "";
        for (let i = 0; i < count; i++) {
          let cls = "good";
          if (tone === "bad" && i > count - 12) cls = "bad";
          if ((tone === "warn" || tone === "maint") && i > count - 8)
            cls = "warn";
          const active =
            i === Math.min(selectedDayIndex, count - 1) ? " active" : "";
          html += `<button class="uptime-bar ${cls}${active}" type="button" aria-label="View day ${i + 1}" onclick="selectUptimeDay(${i})"></button>`;
        }
        el.innerHTML = html;
      }

      function renderMonths(id) {
        document.getElementById(id).innerHTML = getPeriodMonths()
          .map((m, index) => {
            const suffix = index === 2 ? "Today" : "100.0%";
            return `<span>${periodLabel(m, "short")} · ${suffix}</span>`;
          })
          .join("");
      }

      function selectedDayDate() {
        const date = new Date(selectedPeriod);
        const daysBack = 89 - selectedDayIndex;
        date.setDate(date.getDate() - daysBack);
        return date;
      }

      function selectUptimeDay(index) {
        selectedDayIndex = index;
        const cfg =
          STATUS[lastStatusData?.overallStatus || "operational"] ||
          STATUS.operational;
        buildBars("locations-bars", cfg.tone);
        buildBars("services-bars", cfg.tone);
        renderUptimeDetail(cfg);
      }

      function renderUptimeDetail(cfg) {
        const detail = document.getElementById("locations-detail");
        const date = selectedDayDate();
        const message =
          cfg.tone === "good" ? "No downtime reported" : cfg.title;
        detail.innerHTML = `
    <div class="uptime-detail-date">${date.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}</div>
    <div class="uptime-detail-state"><span class="tiny-dot">${cfg.icon}</span>${esc(message)}</div>
    <div class="uptime-detail-line"></div>
  `;
      }

      function renderPeriod() {
        const months = getPeriodMonths();
        document.getElementById("period-label").textContent =
          `${periodLabel(months[0], "short")} to ${periodLabel(months[2], "short")}`;
        renderMonths("locations-months");
        renderMonths("services-months");
      }

      function renderServices(overallStatus) {
        const cfg = STATUS[overallStatus] || STATUS.operational;
        document.getElementById("services-box").innerHTML = SERVICES.map(
          (group) => `
    <div class="service-group">
      <div class="group-title"><span class="chev">›</span>${esc(group.name)}</div>
      ${group.items
        .map(
          (item) => `
        <a class="service-row" href="https://status.vexonac.com" aria-label="${esc(item)} status">
          <div class="service-name"><span class="tiny-dot">${cfg.icon}</span>${esc(item)} ${externalIcon()}</div>
          <div class="status-pill ${cfg.tone}">${cfg.label}</div>
        </a>
      `
        )
        .join("")}
    </div>
  `
        ).join("");
      }

      function eventIcon(type, status) {
        if (status === "resolved" || status === "completed")
          return `<span class="tiny-dot">${checkIcon()}</span>`;
        if (type === "maintenance")
          return `<span class="tiny-dot">${wrenchIcon()}</span>`;
        return `<span class="tiny-dot" style="background:rgba(239,68,68,.14);color:#fda4af">${xIcon()}</span>`;
      }

      function collectEvents(data) {
        const events = [];
        for (const inc of data.activeIncidents || []) {
          const updates = (inc.updates || []).length
            ? inc.updates
            : [
                {
                  status: inc.status,
                  message: inc.title,
                  createdAt: inc.createdAt,
                },
              ];
          events.push({
            type: "incident",
            title: inc.title,
            status: inc.status,
            date: inc.resolvedAt || inc.updatedAt || inc.createdAt,
            updates: updates
              .map((u) => ({
                status: u.status,
                message: u.message,
                createdAt: u.createdAt,
              }))
              .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)),
          });
        }
        for (const m of data.upcomingMaintenance || []) {
          events.push({
            type: "maintenance",
            title: m.title,
            status: m.status,
            date: m.actualEnd || m.scheduledStart || m.createdAt,
            updates: [
              {
                status: m.status,
                message:
                  m.description ||
                  "Scheduled maintenance for VexonAC services.",
                createdAt: m.updatedAt || m.scheduledStart || m.createdAt,
              },
              {
                status: "planned",
                message: `Window: ${fmtDate(m.scheduledStart)} to ${fmtDate(m.scheduledEnd)}.`,
                createdAt: m.createdAt || m.scheduledStart,
              },
            ],
          });
        }
        return events.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      function renderHistory(data) {
        const host = document.getElementById("notice-history");
        const events = collectEvents(data);
        const months = new Map();
        for (const event of events) {
          const key = monthLabel(event.date);
          if (!months.has(key)) months.set(key, []);
          months.get(key).push(event);
        }

        const nowKey = monthLabel(new Date());
        if (!months.has(nowKey)) months.set(nowKey, []);

        host.innerHTML = [...months.entries()]
          .slice(0, 6)
          .map(
            ([month, items]) => `
    <div class="month-block">
      <div class="month-head">${esc(month)}</div>
      ${
        items.length
          ? items.map(renderEvent).join("")
          : `
        <div class="notice-empty">
          <span class="tiny-dot">${checkIcon()}</span>
          <span>No notices reported this month</span>
        </div>
      `
      }
    </div>
  `
          )
          .join("");
      }

      function renderRecentNotices(data) {
        const host = document.getElementById("recent-notices");
        const active = [
          ...(data.activeIncidents || []).map((item) => ({
            type: "incident",
            ...item,
          })),
          ...(data.upcomingMaintenance || []).map((item) => ({
            type: "maintenance",
            impact: item.status === "in_progress" ? "major" : "none",
            updates: [
              {
                message: item.description || "Scheduled maintenance.",
                createdAt: item.scheduledStart,
                status: item.status,
              },
            ],
            ...item,
          })),
        ];

        if (active.length === 0) {
          host.innerHTML = `
      <div class="notice-empty">
        <span class="tiny-dot">${checkIcon()}</span>
        <span>No notices reported for the past 7 days</span>
      </div>
    `;
          return;
        }

        host.innerHTML = active
          .map((item) => {
            const update = (item.updates || [])[0] || {};
            const severity = item.impact || "none";
            return `
      <article class="notice-alert ${esc(severity)}" onclick="document.getElementById('history-toggle').click()">
        <div class="notice-alert-head">
          <div class="notice-alert-title">${eventIcon(item.type, item.status)} ${esc(item.title)}</div>
          <span class="severity-badge ${esc(severity)}">${severity === "none" ? "Info" : esc(severity)}</span>
        </div>
        <div class="notice-alert-message">${esc(update.message || item.description || "Status notice published by VexonAC.")}</div>
        <div class="notice-alert-meta">${fmtDate(update.createdAt || item.createdAt || item.scheduledStart)}</div>
      </article>
    `;
          })
          .join("");
      }

      function renderEvent(event) {
        return `
    <article class="notice-card">
      <div class="notice-summary">
        <div class="notice-name">${eventIcon(event.type, event.status)} ${esc(event.title)}</div>
        <div class="notice-chevron">›</div>
      </div>
      ${event.updates
        .map(
          (update) => `
        <div class="timeline">
          <div><span class="timeline-badge ${esc(update.status)}">${statusLabel(update.status)}</span></div>
          <div class="timeline-text">
            <div class="timeline-time">${fmtDate(update.createdAt)}</div>
            <div>${esc(update.message)}</div>
          </div>
        </div>
      `
        )
        .join("")}
    </article>
  `;
      }

      async function loadStatus() {
        try {
          const res = await fetch(API, {
            headers: { "Content-Type": "application/json" },
          });
          if (!res.ok) throw new Error("Status API returned " + res.status);
          const json = await res.json();
          const data = json.result?.data || json;
          lastStatusData = data;
          const overallStatus = data.overallStatus || "operational";
          const cfg = STATUS[overallStatus] || STATUS.operational;

          document.getElementById("status-orb").innerHTML = cfg.icon;
          document.getElementById("status-title").textContent = cfg.title;
          document.getElementById("status-desc").textContent = cfg.desc;

          const uptime =
            overallStatus === "operational"
              ? "100.0% uptime"
              : overallStatus === "maintenance"
                ? "Maintenance active"
                : "Issue active";
          document.getElementById("locations-uptime").textContent = uptime;
          document.getElementById("services-uptime").textContent = uptime;

          buildBars("locations-bars", cfg.tone);
          buildBars("services-bars", cfg.tone);
          renderPeriod();
          renderUptimeDetail(cfg);
          renderServices(overallStatus);
          renderRecentNotices(data);
          renderHistory(data);

          document.getElementById("loading").classList.add("hide");
          document.getElementById("app").classList.remove("hide");
        } catch (error) {
          document.getElementById("loading").innerHTML = `
      <div class="error">
        <div style="color:#fda4af;font-weight:800;margin-bottom:10px">Failed to load status data.</div>
        <button class="btn" type="button" onclick="loadStatus()">Retry</button>
      </div>
    `;
        }
      }

      document.getElementById("updates-btn").addEventListener("click", () => {
        const menu = document.getElementById("updates-menu");
        const open = !menu.classList.contains("open");
        menu.classList.toggle("open", open);
        document
          .getElementById("updates-btn")
          .setAttribute("aria-expanded", String(open));
      });

      document.addEventListener("click", (event) => {
        const menu = document.getElementById("updates-menu");
        const button = document.getElementById("updates-btn");
        if (!menu.contains(event.target) && !button.contains(event.target)) {
          menu.classList.remove("open");
          button.setAttribute("aria-expanded", "false");
        }
      });

      document.getElementById("prev-period").addEventListener("click", () => {
        selectedPeriod = addMonths(selectedPeriod, -1);
        selectedDayIndex = 89;
        renderPeriod();
        const cfg =
          STATUS[lastStatusData?.overallStatus || "operational"] ||
          STATUS.operational;
        buildBars("locations-bars", cfg.tone);
        buildBars("services-bars", cfg.tone);
        renderUptimeDetail(cfg);
      });

      document.getElementById("next-period").addEventListener("click", () => {
        selectedPeriod = addMonths(selectedPeriod, 1);
        selectedDayIndex = 89;
        renderPeriod();
        const cfg =
          STATUS[lastStatusData?.overallStatus || "operational"] ||
          STATUS.operational;
        buildBars("locations-bars", cfg.tone);
        buildBars("services-bars", cfg.tone);
        renderUptimeDetail(cfg);
      });

      document
        .getElementById("history-toggle")
        .addEventListener("click", () => {
          historyVisible = !historyVisible;
          document
            .getElementById("notice-history")
            .classList.toggle("hide", !historyVisible);
          document.getElementById("history-toggle").textContent = historyVisible
            ? "Hide notice history"
            : "Show notice history";
        });

      window.addEventListener("resize", () => {
        if (!document.getElementById("app").classList.contains("hide")) {
          const cfg =
            STATUS[lastStatusData?.overallStatus || "operational"] ||
            STATUS.operational;
          buildBars("locations-bars", cfg.tone);
          buildBars("services-bars", cfg.tone);
          renderUptimeDetail(cfg);
        }
      });

      loadStatus();
      setInterval(loadStatus, 60000);
    </script>
  </body>
</html>
